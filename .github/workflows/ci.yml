name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 质量检查：类型检查 + 单元测试 + 构建（Node 22；pi-coding-agent SDK 及其内置 undici 要求 Node ≥22）
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # 发布：仅在 push 到 main 且测试通过后运行；版本号未发布过才发布 npm，随后自动建 GitHub Release
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "pi-weixin-bridge@$VERSION" version >/dev/null 2>&1; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "版本 $VERSION 已发布到 npm，跳过发布"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "版本 $VERSION 尚未发布，将发布到 npm"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'no'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.check.outputs.version }}
          node scripts/extract-changelog.mjs "$VERSION" > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
