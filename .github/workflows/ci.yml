name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

# 同分支串行；不取消进行中的（避免中断进行中的 npm 发布）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 质量检查：类型检查 + 单元测试 + 构建（Node 22；pi-coding-agent SDK 及其内置 undici 要求 Node ≥22）
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        shell: node scripts/ci-run.mjs {0}
        run: '{"npm": ["ci"]}'

      - name: Type check
        shell: node scripts/ci-run.mjs {0}
        run: '{"npm": ["run", "typecheck"]}'

      - name: Unit tests
        shell: node scripts/ci-run.mjs {0}
        run: '{"npm": ["test"]}'

      - name: Build
        shell: node scripts/ci-run.mjs {0}
        run: '{"npm": ["run", "build"]}'

      - name: Check version change
        shell: node scripts/ci-run.mjs {0}
        id: version
        if: github.event_name == 'push'
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: '{"node": ["scripts/release-version.mjs"]}'

  # 新版本修改和推送前须由维护者确认，CI 仅在本次推送确实改变版本号时发布。
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # 创建 GitHub Release 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check if version already published
        id: check
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "pi-weixin-bridge@$VERSION" version >/dev/null 2>&1; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "版本 $VERSION 已发布到 npm，跳过发布"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "版本 $VERSION 尚未发布，将发布到 npm"
          fi

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p tmp
          node scripts/extract-changelog.mjs "$VERSION" > tmp/release-notes.md

      - name: Publish to npm
        if: steps.check.outputs.skip == 'no'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        # 表达式经 env 传入，不直接插值进 shell（防注入）；release 幂等（已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --target "$RELEASE_COMMIT" --title "v$VERSION" --notes-file tmp/release-notes.md
